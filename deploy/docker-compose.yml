# Skimr with SQLite: one container, everything persistent in the skimr-data volume.
#   docker compose -f docker-compose.yml up -d
# Then open http://localhost:8080 and enter the setup code from:
#   docker compose -f docker-compose.yml logs skimr | grep "setup code"
# Fixed project name, so the volume is always skimr_skimr-data (see the README backup section).
name: skimr

services:
  skimr:
    # Pin a release with SKIMR_VERSION (e.g. 0.1.1 or 0.1); latest follows every release.
    image: ghcr.io/stevehellier/skimr:${SKIMR_VERSION:-latest}
    restart: unless-stopped
    ports:
      # Host port; change with SKIMR_PORT (in deploy/.env or the shell) if 8080 is taken.
      - "${SKIMR_PORT:-8080}:8080"
    volumes:
      - skimr-data:/data
    environment:
      # Any setting can be given as SKIMR__Section__Key; see the README's configuration table.
      SKIMR__Registration__DefaultMode: InviteOnly

volumes:
  skimr-data:
