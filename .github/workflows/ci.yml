name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs the whole suite before it publishes anything.
  workflow_call:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Headless Chromium for the Playwright E2E tests (agreed in Phase 4).
      - run: pwsh tests/Skimr.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      # Postgres tests use Testcontainers; Docker is preinstalled on ubuntu-latest.
      - run: dotnet test --no-build -c Release
      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/Skimr.E2ETests/bin/Release/net10.0/screenshots/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: skimr:ci
          cache-from: type=gha
      - name: Smoke test
        run: |
          docker run -d --name skimr-ci -p 8080:8080 skimr:ci
          healthy=false
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' skimr-ci)
            [ "$status" = "healthy" ] && healthy=true && break
            sleep 3
          done
          if [ "$healthy" != true ]; then docker logs skimr-ci; exit 1; fi

          # The published image must serve every script and stylesheet a signed-out visitor needs
          # (the test host serves them from the build output and can't catch a broken publish).
          docker logs skimr-ci 2>&1 | grep -q "setup code" || { echo "setup code not logged"; exit 1; }
          html=$(curl -sf http://localhost:8080/setup)
          assets=$(echo "$html" | grep -oE '(href|src)="[^"]+\.(css|js)"' | sed -E 's/^(href|src)="//; s/"$//' | sort -u)
          echo "$assets" | grep -q "_framework/blazor.web" || { echo "page doesn't reference blazor.web.js"; exit 1; }
          # Loaded with a dynamic import(), so it never appears in page HTML; check it explicitly.
          assets="$assets js/reader.js sw.js manifest.webmanifest offline.html"
          for asset in $assets; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/${asset#/}")
            echo "$code $asset"
            [ "$code" = "200" ] || exit 1
          done

  install-linux:
    # A real systemd host: install, upgrade and uninstall the linux-x64 single-file build.
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Publish linux-x64
        run: dotnet publish src/Skimr.Web -p:PublishProfile=linux-x64
      - name: Stage release folder
        run: |
          mkdir -p "$RUNNER_TEMP/skimr"
          cp -a artifacts/publish/linux-x64/. "$RUNNER_TEMP/skimr/"
          rm -f "$RUNNER_TEMP/skimr/web.config" "$RUNNER_TEMP/skimr/appsettings.Development.json"
          cp deploy/install.sh deploy/skimr.service "$RUNNER_TEMP/skimr/"
      - name: Install
        run: sudo "$RUNNER_TEMP/skimr/install.sh" --port 8090
      - name: Check
        run: |
          curl -sf http://localhost:8090/health/ready
          curl -sf -o /dev/null http://localhost:8090/setup
          test "$(systemctl show -p User --value skimr)" = skimr
          sudo stat -c '%U:%G %a' /etc/skimr/skimr.env | grep -qx 'root:skimr 640'
          systemd-analyze security skimr.service --no-pager | tail -n 1
          sudo journalctl -u skimr --no-pager | grep -q "setup code"
      - name: Upgrade in place
        run: |
          sudo "$RUNNER_TEMP/skimr/install.sh" | tee "$RUNNER_TEMP/upgrade.txt"
          grep -q "upgraded" "$RUNNER_TEMP/upgrade.txt"
          curl -sf http://localhost:8090/health/ready
      - name: Uninstall and purge
        run: |
          sudo "$RUNNER_TEMP/skimr/install.sh" --uninstall
          test -d /var/lib/skimr
          sudo "$RUNNER_TEMP/skimr/install.sh" --uninstall --purge
          if id skimr; then exit 1; fi
          test ! -e /var/lib/skimr
