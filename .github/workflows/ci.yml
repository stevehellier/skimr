name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Headless Chromium for the Playwright E2E tests (agreed in Phase 4).
      - run: pwsh tests/Skimr.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      # Postgres tests use Testcontainers; Docker is preinstalled on ubuntu-latest.
      - run: dotnet test --no-build -c Release
      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/Skimr.E2ETests/bin/Release/net10.0/screenshots/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: skimr:ci
          cache-from: type=gha
      - name: Smoke test
        run: |
          docker run -d --name skimr-ci -p 8080:8080 skimr:ci
          healthy=false
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' skimr-ci)
            [ "$status" = "healthy" ] && healthy=true && break
            sleep 3
          done
          if [ "$healthy" != true ]; then docker logs skimr-ci; exit 1; fi

          # The published image must serve every script and stylesheet a signed-out visitor needs
          # (the test host serves them from the build output and can't catch a broken publish).
          docker logs skimr-ci 2>&1 | grep -q "setup code" || { echo "setup code not logged"; exit 1; }
          html=$(curl -sf http://localhost:8080/setup)
          assets=$(echo "$html" | grep -oE '(href|src)="[^"]+\.(css|js)"' | sed -E 's/^(href|src)="//; s/"$//' | sort -u)
          echo "$assets" | grep -q "_framework/blazor.web" || { echo "page doesn't reference blazor.web.js"; exit 1; }
          # Loaded with a dynamic import(), so it never appears in page HTML; check it explicitly.
          assets="$assets js/reader.js"
          for asset in $assets; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/${asset#/}")
            echo "$code $asset"
            [ "$code" = "200" ] || exit 1
          done
